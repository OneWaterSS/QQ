name: 每日情话邮件

on:
  schedule:
    # 每天 UTC 21:20 = 北京时间 05:20
    - cron: '20 21 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行发邮件
        env:
          TZ: Asia/Shanghai
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TO_ADDR: ${{ secrets.TO_ADDR }}
        run: python send_email.py
